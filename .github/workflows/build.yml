name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false
env:
  PREMAKE_VERSION: "5.0.0-beta6"
jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    strategy:
      matrix:
        configuration:
          - debug
          - release
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Install Premake5
        uses: diamante0018/setup-premake@master
        with:
          version: ${{ env.PREMAKE_VERSION }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build ${{matrix.configuration}} binaries
        run: msbuild /m /v:minimal /p:Configuration=${{matrix.configuration}} /p:Platform=x64 build/tpp-server-emulator.sln

      - name: Upload ${{matrix.configuration}} binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{matrix.configuration}}
          path: |
            build/bin/x64/${{matrix.configuration}}/tpp-server-emulator.exe
            build/bin/x64/${{matrix.configuration}}/tpp-server-emulator.pdb

      - name: Upload ${{matrix.configuration}} resources
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.configuration}}-resources
          path: |
            src/server/resources/*

      - name: Upload ${{matrix.arch}} libs
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: |
            deps/mysql/lib/*.dll
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    container: ubuntu:noble
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - debug
          - release
        arch:
          - x64
    steps:
      - name: Install g++ and multilib
        run: |
          apt-get update
          apt-get install -y wget libcurl4-openssl-dev clang lld unzip git make gcc-13 g++-13 gcc-13-multilib g++-13-multilib
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 13
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 13
          update-alternatives --set gcc /usr/bin/gcc-13
          update-alternatives --set g++ /usr/bin/g++-13

      - name: Check out files
        uses: actions/checkout@main
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Install Premake5
        uses: diamante0018/setup-premake@master
        with:
          version: ${{ env.PREMAKE_VERSION }}

      - name: Install Mold
        uses: rui314/setup-mold@staging

      - name: Generate project files
        working-directory: ${{ github.workspace }}
        run: premake5 gmake

      - name: Set up problem matching
        uses: ammaraskar/gcc-problem-matcher@master

      - name: Build ${{matrix.arch}} ${{matrix.configuration}} binaries
        working-directory: ${{ github.workspace }}
        run: |
          make -C build config=${{matrix.configuration}}_${{matrix.arch}} -j$(nproc)

      - name: Upload ${{matrix.arch}} ${{matrix.configuration}} binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{matrix.arch}}-${{matrix.configuration}}
          path: |
            build/bin/${{matrix.arch}}/${{matrix.configuration}}/tpp-server-emulator

      - name: Upload ${{matrix.arch}} libs
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: |
            deps/mysql/lib/*.so*
  deploy:
    name: Deploy artifacts
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Setup main environment
        if: github.ref == 'refs/heads/main'
        run: echo "ALICE_MASTER_PATH=${{ secrets.ALICE_MASTER_SSH_PATH }}" >> $GITHUB_ENV

      - name: Download windows release binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Download linux release binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-release

      - name: Download release resources
        uses: actions/download-artifact@v4
        with:
          name: release-resources
          path: resources

      - name: Download libs
        uses: actions/download-artifact@v4
        with:
          name: libs
          path: libs

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2.7.0
        with:
          key: ${{ secrets.ALICE_MASTER_SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.ALICE_MASTER_SSH_ADDRESS }} >> ~/.ssh/known_hosts

      - name: Remove old data files
        run: ssh ${{ secrets.ALICE_MASTER_SSH_USER }}@${{ secrets.ALICE_MASTER_SSH_ADDRESS }} rm -rf ${{ env.ALICE_MASTER_PATH }}/tpp-server-emulator/*

      - name: Upload windows binary
        run: rsync -avz tpp-server-emulator.exe ${{ secrets.ALICE_MASTER_SSH_USER }}@${{ secrets.ALICE_MASTER_SSH_ADDRESS }}:${{ env.ALICE_MASTER_PATH }}/tpp-server-emulator/

      - name: Upload linux binary
        run: rsync -avz tpp-server-emulator ${{ secrets.ALICE_MASTER_SSH_USER }}@${{ secrets.ALICE_MASTER_SSH_ADDRESS }}:${{ env.ALICE_MASTER_PATH }}/tpp-server-emulator/

      - name: Upload resources
        run: rsync -avz ./resources ${{ secrets.ALICE_MASTER_SSH_USER }}@${{ secrets.ALICE_MASTER_SSH_ADDRESS }}:${{ env.ALICE_MASTER_PATH }}/tpp-server-emulator/

      - name: Upload libs
        run: rsync -avz ./libs ${{ secrets.ALICE_MASTER_SSH_USER }}@${{ secrets.ALICE_MASTER_SSH_ADDRESS }}:${{ env.ALICE_MASTER_PATH }}/tpp-server-emulator/

      - name: Publish changes
        run: ssh ${{ secrets.ALICE_MASTER_SSH_USER }}@${{ secrets.ALICE_MASTER_SSH_ADDRESS }} ${{ secrets.ALICE_MASTER_SSH_CHANGE_PUBLISH_COMMAND }}
